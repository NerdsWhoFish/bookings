name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.x
          check-latest: true
          cache: true
      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Formatting
        run: |
          files=$(find cmd internal -name '*.go' -exec gofmt -l {} +)
          test -z "$files" || { echo "$files"; exit 1; }
      - name: Test
        run: go test -race ./cmd/... ./internal/...
      - name: Vet
        run: go vet ./cmd/... ./internal/...
      - name: Vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./cmd/... ./internal/...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: web

  opentofu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.6
      - run: tofu fmt -check -recursive infra
      - run: tofu -chdir=infra/examples/basic init -backend=false
      - run: tofu -chdir=infra/examples/basic validate

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t bookings:ci .
