name: release

on:
  workflow_dispatch:
    inputs:
      scope:
        description: What to cut
        type: choice
        default: Release
        options: [Release, Release Candidate]
      bump:
        description: Which part of the version to bump
        type: choice
        default: patch
        options: [patch, minor, major]
      dry-run:
        description: Build and sign without publishing
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: gcp-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.BOOKINGS_WIF_PROVIDER }}
          service_account: ${{ vars.BOOKINGS_RELEASER_SA }}
          token_format: access_token
          create_credentials_file: false
      - uses: TheOutdoorProgrammer/quill@v1
        with:
          bump: ${{ inputs.bump }}
          scope: ${{ inputs.scope }}
          dry-run: ${{ inputs.dry-run }}
          publish: docker
          docker-images: ${{ vars.BOOKINGS_AR_IMAGE }}
          docker-registry: ${{ vars.BOOKINGS_AR_REGISTRY }}
          docker-username: oauth2accesstoken
          docker-password: ${{ steps.gcp-auth.outputs.access_token }}
          docker-sbom: "true"
          docker-provenance: mode=max
          docker-sign: "true"
